<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpellQuest — Parent Admin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B82F6">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root"></div>

<script>window.SPELLQUEST_START_SCREEN = 'admin';</script>
<script src="lib/sql-wasm.js"></script>
<script src="js/db.js"></script>
<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="js/rewards.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script>
  // See index.html for why this reloads on update rather than just registering.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', async () => {
      try {
        const reg = await navigator.serviceWorker.register('sw.js');
        reg.update().catch(() => {});
        let reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloaded) return;
          reloaded = true;
          window.location.reload();
        });
      } catch (e) { /* offline-first app: registration failure isn't fatal */ }
    });
  }
</script>
</body>
</html>
